<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Short Opportunities</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <script
    src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"
    crossorigin="anonymous"
  ></script>
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    html, body { height: 100%; overflow: hidden; }
    #layout { display: flex; height: 100vh; }

    /* Sidebar: flex column, fixed width, no overflow on the outer container */
    #sidebar {
      width: 290px;
      min-width: 230px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #dee2e6;
      background: #f8f9fa;
      overflow: hidden;
    }

    /* Filter header — stays at top */
    #filter-header {
      flex: 0 0 auto;
      padding: 0.5rem;
      border-bottom: 1px solid #dee2e6;
      background: #fff;
    }

    /* Three panels fill remaining height at 3:6:1 ratio */
    #panels-container {
      flex: 1 1 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .panel { display: flex; flex-direction: column; overflow: hidden; min-height: 36px; }
    #panel-main { flex: 3; }
    #panel-favs { flex: 6; }
    #panel-ignr { flex: 1; }

    /* Draggable splitters between panels */
    .panel-splitter {
      flex: 0 0 6px;
      background: #dee2e6;
      cursor: ns-resize;
      position: relative;
      user-select: none;
    }
    .panel-splitter::after {
      content: '';
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: 24px; height: 4px;
      border-top: 1px solid #adb5bd;
      border-bottom: 1px solid #adb5bd;
    }
    .panel-splitter:hover, .panel-splitter.dragging { background: #6ea8fe; }

    .panel-header {
      flex: 0 0 auto;
      padding: 0.25rem 0.6rem;
      background: #e9ecef;
      font-size: 0.78rem;
      font-weight: 600;
      color: #495057;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }
    .panel-body { flex: 1 1 0; overflow-y: auto; }

    /* Asset items */
    .asset-item {
      cursor: pointer;
      padding: 0.35rem 0.6rem;
      border-bottom: 1px solid #e9ecef;
      font-size: 0.83rem;
      transition: background 0.1s;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.3rem;
    }
    .asset-item:hover, .asset-item.active { background: #dbe9ff; }
    .asset-item:focus { outline: 2px solid #6ea8fe; outline-offset: -2px; }

    .item-label { flex: 1; min-width: 0; }
    .rank  { color: #6c757d; min-width: 2.2rem; display: inline-block; font-size: 0.78rem; }
    .mcap  { color: #6c757d; font-size: 0.73rem; }

    /* Icon buttons */
    .icon-btn {
      background: none;
      border: none;
      padding: 0 2px;
      font-size: 0.85rem;
      line-height: 1;
      cursor: pointer;
      opacity: 0.45;
      transition: opacity 0.1s, color 0.1s;
      flex: 0 0 auto;
    }
    .icon-btn:hover { opacity: 1; }
    .icon-btn.fav-active { color: #f5a623; opacity: 1; }

    /* Fav/ignore list items */
    .aux-item {
      padding: 0.3rem 0.6rem;
      border-bottom: 1px solid #e9ecef;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.3rem;
    }
    .aux-item .aux-label { flex: 1; min-width: 0; cursor: pointer; }
    .aux-item .aux-label:hover { text-decoration: underline; }

    #loading-indicator {
      display: none;
      padding: 2rem;
      text-align: center;
      color: #6c757d;
    }
    htmx-request #loading-indicator { display: block; }
    htmx-request #detail-pane       { display: none; }

    #main-pane { flex: 1; overflow-y: auto; padding: 1.5rem; }
  </style>
</head>
<body>
<div id="layout">

  <!-- Left sidebar -->
  <div id="sidebar">

    <!-- Filter header -->
    <div id="filter-header">
      <div class="d-flex align-items-center gap-2 mb-2">
        <div class="btn-group btn-group-sm" role="group" aria-label="Network">
          <input type="radio" class="btn-check" name="sidebar_network" id="net-sidebar-testnet" value="testnet" checked>
          <label class="btn btn-outline-secondary" for="net-sidebar-testnet">Testnet</label>
          <input type="radio" class="btn-check" name="sidebar_network" id="net-sidebar-mainnet" value="mainnet">
          <label class="btn btn-outline-danger" for="net-sidebar-mainnet">Mainnet</label>
        </div>
      </div>
      <input type="hidden" id="network-input" name="network" value="testnet">
      <div class="d-flex align-items-center mb-1">
        <strong style="font-size:0.9rem">Assets</strong>
        <span id="filter-badge" class="badge bg-secondary ms-1">{{ assets | length }}</span>
        <span id="init-spinner" class="spinner-border spinner-border-sm text-secondary ms-1" role="status" aria-label="Loading…"></span>
      </div>
      <input
        id="filter-input"
        type="search"
        class="form-control form-control-sm"
        placeholder="Filter…"
        autocomplete="off"
        spellcheck="false"
      />
    </div>

    <div id="panels-container">

      <!-- Main list (30%) -->
      <div id="panel-main" class="panel">
        <div class="panel-header">
          <span>Main</span>
          <span id="main-badge" class="badge bg-secondary" style="font-size:0.7rem"></span>
        </div>
        <div id="main-list" class="panel-body">
          {% include "asset_list_partial.html" %}
        </div>
      </div>

      <div class="panel-splitter" id="split-main-favs"></div>

      <!-- Favourites list (60%) -->
      <div id="panel-favs" class="panel">
        <div class="panel-header">
          <span style="color:#f5a623">&#9733;</span>
          <span>Favourites</span>
          <span id="fav-badge" class="badge bg-warning text-dark" style="font-size:0.7rem"></span>
        </div>
        <div id="fav-list" class="panel-body"></div>
      </div>

      <div class="panel-splitter" id="split-favs-ignr"></div>

      <!-- Ignore list (10%) -->
      <div id="panel-ignr" class="panel">
        <div class="panel-header">
          <span>Ignored</span>
          <span id="ign-badge" class="badge bg-secondary" style="font-size:0.7rem"></span>
        </div>
        <div id="ign-list" class="panel-body"></div>
      </div>

    </div>
  </div>

  <!-- Right pane: detail / chart -->
  <div id="main-pane">
    <div id="loading-indicator">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2">Generating chart…</p>
    </div>
    <div id="detail-pane">
      <div class="text-center text-muted mt-5">
        <h4>Select an asset from the list to view its chart.</h4>
      </div>
    </div>
  </div>

</div>
</body>
<script>
// ---------------------------------------------------------------------------
// State — populated from server on init, then kept in sync
// ---------------------------------------------------------------------------
const favSet    = new Set();
const ignoreSet = new Set();

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
function mainItemEl(sym) {
  return document.querySelector(`#main-list .asset-item[data-symbol="${sym}"]`);
}

function visibleMainItems() {
  return Array.from(document.querySelectorAll('#main-list .asset-item'))
              .filter(el => el.style.display !== 'none');
}

// ---------------------------------------------------------------------------
// Apply current Sets to the DOM
// ---------------------------------------------------------------------------
function applyStoredState() {
  document.querySelectorAll('#main-list .asset-item').forEach(el => {
    const sym = el.dataset.symbol;
    el.style.display = ignoreSet.has(sym) ? 'none' : '';
    el.querySelector('.fav-btn').classList.toggle('fav-active', favSet.has(sym));
  });
  updateMainBadge();
  renderFavPanel();
  renderIgnorePanel();
}

// ---------------------------------------------------------------------------
// Badge counters
// ---------------------------------------------------------------------------
function updateMainBadge() {
  const shown = visibleMainItems().length;
  const total = document.querySelectorAll('#main-list .asset-item').length;
  const q = document.getElementById('filter-input').value.trim();
  document.getElementById('main-badge').textContent = q ? (shown + ' / ' + total) : total;
}

// ---------------------------------------------------------------------------
// Render auxiliary panels
// ---------------------------------------------------------------------------
function renderFavPanel() {
  const container = document.getElementById('fav-list');
  container.innerHTML = '';
  favSet.forEach(sym => {
    const div = document.createElement('div');
    div.className = 'aux-item';
    div.innerHTML =
      `<span class="aux-label" onclick="activateBySymbol('${sym}')"><strong>${sym}</strong></span>` +
      `<button class="icon-btn fav-active" title="Remove from favourites" onclick="toggleFav('${sym}')">&#9733;</button>`;
    container.appendChild(div);
  });
  document.getElementById('fav-badge').textContent = favSet.size || '';
}

function renderIgnorePanel() {
  const container = document.getElementById('ign-list');
  container.innerHTML = '';
  ignoreSet.forEach(sym => {
    const div = document.createElement('div');
    div.className = 'aux-item';
    div.innerHTML =
      `<span class="aux-label text-muted" onclick="restoreIgnored('${sym}')">${sym}</span>` +
      `<button class="icon-btn" title="Restore to main list" onclick="restoreIgnored('${sym}')">&#8617;</button>`;
    container.appendChild(div);
  });
  document.getElementById('ign-badge').textContent = ignoreSet.size || '';
}

// ---------------------------------------------------------------------------
// Server API helpers
// ---------------------------------------------------------------------------
function apiPost(url)   { return fetch(url, {method: 'POST'}); }
function apiDelete(url) { return fetch(url, {method: 'DELETE'}); }

// ---------------------------------------------------------------------------
// Favourites
// ---------------------------------------------------------------------------
function toggleFav(sym) {
  if (favSet.has(sym)) {
    favSet.delete(sym);
    apiDelete(`/lists/fav/${sym}`);
  } else {
    favSet.add(sym);
    apiPost(`/lists/fav/${sym}`);
  }
  const mainEl = mainItemEl(sym);
  if (mainEl) mainEl.querySelector('.fav-btn').classList.toggle('fav-active', favSet.has(sym));
  renderFavPanel();
}

// ---------------------------------------------------------------------------
// Ignore
// ---------------------------------------------------------------------------
function addIgnore(sym) {
  const mainEl = mainItemEl(sym);
  if (!mainEl) return;

  const visible = visibleMainItems();
  const idx = visible.indexOf(mainEl);
  const nextEl = visible[idx + 1] ?? visible[idx - 1] ?? null;

  ignoreSet.add(sym);
  apiPost(`/lists/ignore/${sym}`);
  mainEl.style.display = 'none';
  updateMainBadge();
  renderIgnorePanel();

  if (nextEl) activateItem(nextEl);
}

function restoreIgnored(sym) {
  ignoreSet.delete(sym);
  apiDelete(`/lists/ignore/${sym}`);
  const mainEl = mainItemEl(sym);
  if (mainEl) {
    mainEl.style.display = '';
    const q = document.getElementById('filter-input').value.trim().toLowerCase();
    if (q && !sym.toLowerCase().includes(q)) mainEl.style.display = 'none';
  }
  updateMainBadge();
  renderIgnorePanel();
  if (mainEl && mainEl.style.display !== 'none') activateItem(mainEl);
}

// ---------------------------------------------------------------------------
// Activate (load chart)
// ---------------------------------------------------------------------------
let _activating = false;
function activateItem(el) {
  // Guard against re-entrant calls caused by htmx.trigger re-firing the onclick handler.
  if (_activating) return;
  _activating = true;
  try {
    document.querySelectorAll('.asset-item').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
    el.focus();
    el.scrollIntoView({ block: 'nearest' });

    htmx.trigger(el, 'click');
  } finally {
    _activating = false;
  }
}

function activateBySymbol(sym) {
  const el = mainItemEl(sym);
  if (el && el.style.display !== 'none') activateItem(el);
}

// ---------------------------------------------------------------------------
// Live filter (main list only)
// ---------------------------------------------------------------------------
document.getElementById('filter-input').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  document.querySelectorAll('#main-list .asset-item').forEach(el => {
    if (ignoreSet.has(el.dataset.symbol)) { el.style.display = 'none'; return; }
    el.style.display = (!q || el.dataset.symbol.toLowerCase().includes(q)) ? '' : 'none';
  });
  updateMainBadge();
});

// ---------------------------------------------------------------------------
// Keyboard navigation + hotkeys
// ---------------------------------------------------------------------------
document.addEventListener('keydown', function(e) {
  const filterInput = document.getElementById('filter-input');

  if (e.key === 'Escape') {
    filterInput.value = '';
    filterInput.dispatchEvent(new Event('input'));
    filterInput.focus();
    return;
  }

  // Hotkeys on a focused main-list item (no modifier keys)
  if (!e.ctrlKey && !e.altKey && !e.metaKey &&
      document.activeElement.matches('#main-list .asset-item')) {
    const sym = document.activeElement.dataset.symbol;
    if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFav(sym);  return; }
    if (e.key === 'i' || e.key === 'I') { e.preventDefault(); addIgnore(sym);  return; }
  }

  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    const items = visibleMainItems();
    if (!items.length) return;

    const sidebar = document.getElementById('sidebar');
    if (!sidebar.contains(document.activeElement) &&
        !document.querySelector('#main-list .asset-item.active')) return;

    if (e.key === 'ArrowDown' && document.activeElement === filterInput) {
      e.preventDefault();
      activateItem(items[0]);
      return;
    }

    e.preventDefault();
    const activeEl = document.querySelector('#main-list .asset-item.active');
    const idx = activeEl ? items.indexOf(activeEl) : -1;
    const next = e.key === 'ArrowDown'
      ? (items[idx + 1] ?? items[0])
      : (items[idx - 1] ?? items[items.length - 1]);
    activateItem(next);
  }
});

// ---------------------------------------------------------------------------
// Panel splitter drag logic
// ---------------------------------------------------------------------------
(function () {
  const HEIGHTS_KEY = 'panelHeights';
  const MIN_H = 36;

  const panels = {
    main: document.getElementById('panel-main'),
    favs: document.getElementById('panel-favs'),
    ignr: document.getElementById('panel-ignr'),
  };

  function applyHeights(h) {
    panels.main.style.flex = `0 0 ${h.main}px`;
    panels.favs.style.flex = `0 0 ${h.favs}px`;
    panels.ignr.style.flex = `0 0 ${h.ignr}px`;
  }

  function saveHeights() {
    localStorage.setItem(HEIGHTS_KEY, JSON.stringify({
      main: panels.main.offsetHeight,
      favs: panels.favs.offsetHeight,
      ignr: panels.ignr.offsetHeight,
    }));
  }

  function initPanelHeights() {
    const stored = localStorage.getItem(HEIGHTS_KEY);
    if (stored) {
      try { applyHeights(JSON.parse(stored)); return; } catch (_) {}
    }
    // Snapshot the browser's initial flex layout after first paint
    requestAnimationFrame(() => {
      applyHeights({
        main: panels.main.offsetHeight,
        favs: panels.favs.offsetHeight,
        ignr: panels.ignr.offsetHeight,
      });
    });
  }

  function makeDraggable(splitterId, topPanel, botPanel) {
    const splitter = document.getElementById(splitterId);
    let dragging = false, startY = 0, topStart = 0, botStart = 0;

    splitter.addEventListener('mousedown', function (e) {
      dragging = true;
      startY   = e.clientY;
      topStart = topPanel.offsetHeight;
      botStart = botPanel.offsetHeight;
      splitter.classList.add('dragging');
      document.body.style.userSelect = 'none';
      document.body.style.cursor = 'ns-resize';
      e.preventDefault();
    });

    document.addEventListener('mousemove', function (e) {
      if (!dragging) return;
      const dy     = e.clientY - startY;
      const newTop = Math.max(MIN_H, topStart + dy);
      const newBot = Math.max(MIN_H, botStart - dy);
      topPanel.style.flex = `0 0 ${newTop}px`;
      botPanel.style.flex = `0 0 ${newBot}px`;
    });

    document.addEventListener('mouseup', function () {
      if (!dragging) return;
      dragging = false;
      splitter.classList.remove('dragging');
      document.body.style.userSelect = '';
      document.body.style.cursor = '';
      saveHeights();
    });
  }

  initPanelHeights();
  makeDraggable('split-main-favs', panels.main, panels.favs);
  makeDraggable('split-favs-ignr', panels.favs, panels.ignr);
})();

// ---------------------------------------------------------------------------
// Init — load state from server, then render
// ---------------------------------------------------------------------------
fetch('/lists')
  .then(r => r.json())
  .then(data => {
    (data.favs    ?? []).forEach(s => favSet.add(s));
    (data.ignored ?? []).forEach(s => ignoreSet.add(s));
    applyStoredState();
  })
  .catch(err => console.warn('[lists] fetch failed:', err))
  .finally(() => {
    document.getElementById('init-spinner').style.display = 'none';
  });

// ---------------------------------------------------------------------------
// Network toggle
// ---------------------------------------------------------------------------
window.currentNetwork = 'testnet';

document.querySelectorAll('input[name="sidebar_network"]').forEach(r => {
  r.addEventListener('change', () => {
    if (!r.checked) return;
    window.currentNetwork = r.value;
    document.getElementById('network-input').value = r.value;
    document.dispatchEvent(new CustomEvent('networkchange', {detail: {network: r.value}}));
    htmx.ajax('GET', '/assets-list?network=' + r.value, {
      target: '#main-list',
      swap: 'innerHTML',
    }).then(() => {
      applyStoredState();
      document.getElementById('filter-badge').textContent =
        document.querySelectorAll('#main-list .asset-item').length;
    });
  });
});

// ---------------------------------------------------------------------------
// Accordion toggle (Bootstrap CSS classes, no Bootstrap JS required)
// ---------------------------------------------------------------------------
document.addEventListener('click', function (e) {
  const btn = e.target.closest('.accordion-button[data-bs-toggle="collapse"]');
  if (!btn) return;
  const targetId = btn.getAttribute('data-bs-target');
  if (!targetId) return;
  const panel = document.querySelector(targetId);
  if (!panel) return;
  const expanding = !panel.classList.contains('show');
  panel.classList.toggle('show', expanding);
  btn.classList.toggle('collapsed', !expanding);
  btn.setAttribute('aria-expanded', String(expanding));
});
</script>
</html>

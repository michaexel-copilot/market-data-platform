<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Short Opportunities</title>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <script
    src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"
    crossorigin="anonymous"
  ></script>
  <style>
    html, body { height: 100%; overflow: hidden; }
    #layout   { display: flex; height: 100vh; }
    #sidebar  {
      width: 280px;
      min-width: 220px;
      overflow-y: auto;
      border-right: 1px solid #dee2e6;
      background: #f8f9fa;
    }
    #main-pane {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
    }
    .asset-item {
      cursor: pointer;
      padding: 0.45rem 0.75rem;
      border-bottom: 1px solid #e9ecef;
      font-size: 0.85rem;
      transition: background 0.12s;
    }
    .asset-item:hover, .asset-item.active { background: #dbe9ff; }
    .asset-item:focus { outline: 2px solid #6ea8fe; outline-offset: -2px; }
    .rank   { color: #6c757d; min-width: 2.4rem; display: inline-block; }
    .mcap   { color: #6c757d; font-size: 0.75rem; }
    #loading-indicator {
      display: none;
      padding: 2rem;
      text-align: center;
      color: #6c757d;
    }
    htmx-request #loading-indicator { display: block; }
    htmx-request #detail-pane       { display: none; }
  </style>
</head>
<body>
<div id="layout">

  <!-- Left sidebar: asset list -->
  <div id="sidebar">
    <div class="p-2 border-bottom bg-white sticky-top">
      <div class="d-flex align-items-center mb-1">
        <strong>Assets</strong>
        <span id="filter-badge" class="badge bg-secondary ms-1">{{ assets | length }}</span>
      </div>
      <input
        id="filter-input"
        type="search"
        class="form-control form-control-sm"
        placeholder="Filter…"
        autocomplete="off"
        spellcheck="false"
      />
    </div>
    {% for asset in assets %}
    <div
      class="asset-item"
      tabindex="0"
      hx-get="/asset/{{ asset.symbol }}"
      hx-target="#detail-pane"
      hx-swap="innerHTML"
      data-symbol="{{ asset.symbol }}"
      hx-indicator="#loading-indicator"
      onclick="activateItem(this)"
      onkeydown="if(event.key==='Enter') activateItem(this)"
    >
      <span class="rank">#{{ asset.rank }}</span>
      <strong>{{ asset.symbol }}</strong>
      {% if asset.market_cap_usd %}
      <br/><span class="mcap">
        ${{ "{:,.3f}".format(asset.market_cap_usd / 1e9) }}B
      </span>
      {% endif %}
    </div>
    {% endfor %}
  </div>

  <!-- Right pane: detail / chart -->
  <div id="main-pane">
    <div id="loading-indicator">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-2">Generating chart…</p>
    </div>
    <div id="detail-pane">
      <div class="text-center text-muted mt-5">
        <h4>Select an asset from the list to view its chart.</h4>
      </div>
    </div>
  </div>

</div>
</body>
<script>
  const totalAssets = {{ assets | length }};

  function visibleItems() {
    return Array.from(document.querySelectorAll('.asset-item'))
                .filter(el => el.style.display !== 'none');
  }

  function activateItem(el) {
    document.querySelectorAll('.asset-item').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
    el.focus();
    el.scrollIntoView({ block: 'nearest' });
    htmx.trigger(el, 'click');
  }

  // Live filter
  document.getElementById('filter-input').addEventListener('input', function() {
    const q = this.value.trim().toLowerCase();
    let shown = 0;
    document.querySelectorAll('.asset-item').forEach(el => {
      const match = !q || el.dataset.symbol.toLowerCase().includes(q);
      el.style.display = match ? '' : 'none';
      if (match) shown++;
    });
    document.getElementById('filter-badge').textContent =
      q ? (shown + ' / ' + totalAssets) : totalAssets;
  });

  document.addEventListener('keydown', function(e) {
    const filterInput = document.getElementById('filter-input');

    if (e.key === 'Escape') {
      filterInput.value = '';
      filterInput.dispatchEvent(new Event('input'));
      filterInput.focus();
      return;
    }

    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      const items = visibleItems();
      if (!items.length) return;

      const sidebar = document.getElementById('sidebar');
      if (!sidebar.contains(document.activeElement) &&
          !document.querySelector('.asset-item.active')) return;

      // Arrow-down from filter input → jump to first visible item
      if (e.key === 'ArrowDown' && document.activeElement === filterInput) {
        e.preventDefault();
        activateItem(items[0]);
        return;
      }

      e.preventDefault();
      const activeEl = document.querySelector('.asset-item.active');
      const idx = activeEl ? items.indexOf(activeEl) : -1;
      let next;
      if (e.key === 'ArrowDown') {
        next = items[idx + 1] ?? items[0];
      } else {
        next = items[idx - 1] ?? items[items.length - 1];
      }
      activateItem(next);
    }
  });
</script>
</html>

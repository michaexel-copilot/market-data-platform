[project]
name = "short-desk"
version = "0.1.0"
description = "Fetch market caps from CoinMarketCap and merge with Hyperliquid testnet pairs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests>=2.32.5",
    "matplotlib>=3.9",
    "yfinance>=1.2.0",
    "fastapi>=0.133.0",
    "uvicorn[standard]>=0.41.0",
    "jinja2>=3.1.6",
    "hl-client",
    "python-dotenv>=1.0",
    "httpx>=0.28.1",
    "pandas>=2.0",
    "backtesting>=0.3.3",
    "python-multipart>=0.0.22",
]

[project.scripts]
fetch-market-caps = "fetch_market_caps:main"
draw-chart = "draw_chart:main"
draw-all-charts = "draw_all_charts:main"
serve = "web:main"

[tool.uv]
package = true

[tool.uv.sources]
hl-client = {path = "/work/trading-platform/hyperliquid-python/hl_client"}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "fetch_market_caps.py",
    "coinMarketCapKey.py",
    "draw_chart.py",
    "draw_all_charts.py",
    "cmc_info.py",
    "web.py",
    "hl_order.py",
    "templates",
]

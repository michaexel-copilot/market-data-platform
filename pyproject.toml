[project]
name = "market-data-platform"
version = "0.1.0"
description = "Unified multi-asset-class market data platform with DuckDB storage and REST/gRPC/JSON-RPC API"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.2",
    "duckdb>=1.5.0",
    "fastapi>=0.135.1",
    "grpcio>=1.78.0",
    "grpcio-tools>=1.78.0",
    "httpx>=0.28.1",
    "nasdaq-data-link>=1.0.4",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.41.0",
    "yfinance>=1.2.0",
]

[project.scripts]
serve               = "market_data.api:serve"
ingest              = "market_data.ingestion:run_once"
scheduler           = "market_data.ingestion:run_scheduler"
migrate             = "market_data.db:migrate"
market-data         = "market_data.cli:main"
compute-indicators  = "market_data.cli.compute_indicators:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_data"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.5",
]
